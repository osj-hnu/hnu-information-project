<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container secondary-page"><a class="back-link" th:href="@{/}">← 홈으로</a><h1 th:text="${title}">장비 대여</h1><p class="notice">Figma Make의 가상 자산을 사용한 탐색 화면입니다. 실제 재고·일정 조회 및 신청 기능은 아직 연결되지 않았습니다.</p>
<form class="catalog-search" method="get"><label for="q">이름·사양 검색</label><div class="search-input-row"><input id="q" name="q" th:value="${q}" maxlength="100" placeholder="찾고 있는 시설이나 장비를 입력하세요"><button class="primary-button">검색</button></div></form>
<p class="result-count" th:text="|${#lists.size(resources)}개 항목|">0개 항목</p>
<div class="catalog-grid"><article class="catalog-card" th:each="resource : ${resources}"><span class="icon-box blue"><img th:src="@{/assets/{icon}(icon=${resource.icon})}" alt=""></span><span class="resource-kind" th:text="${resource.kind}">장비</span><h2 th:text="${resource.name}">자원명</h2><p th:text="${resource.description}">사양</p><p class="resource-status">일정 및 이용 조건 확인 필요</p></article></div>
<p th:if="${#lists.isEmpty(resources)}" class="empty-state">검색 결과가 없습니다. 다른 이름이나 사양으로 검색해 보세요.</p>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
